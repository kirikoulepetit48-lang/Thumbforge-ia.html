<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThumbForge AI - Miniatures Virales</title>
<style>
body{margin:0;font-family:system-ui;background:#0a0a0f;color:#fff;padding:16px}
.card{background:#15151f;border:1px solid #ff2e97;border-radius:20px;padding:20px;margin-bottom:16px}
input{width:100%;padding:16px;border-radius:12px;border:1px solid #ff2e97;background:#0a0a0f;color:#fff;font-size:16px;box-sizing:border-box}
.style-btn{padding:12px 16px;border-radius:999px;border:1px solid #333;background:#1a1a27;color:#fff;cursor:pointer}
.style-btn.active{background:linear-gradient(90deg,#ff2e97,#ff7a18);border-color:#ff2e97}
.gen{width:100%;padding:18px;border:0;border-radius:16px;background:linear-gradient(90deg,#ff2e97,#ff7a18);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.thumbs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.thumb{border-radius:12px;overflow:hidden;position:relative;border:2px solid #333;cursor:pointer}
.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover}
.thumb-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:8px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<h1 style="background:linear-gradient(90deg,#ff2e97,#ff7a18);-webkit-background-clip:text;-webkit-text-fill-color:transparent">✨ ThumbForge AI</h1>
<p>Miniatures YouTube/TikTok qui font cliquer</p>

<div class="card">
<input id="title" placeholder="Ex: COMMENT DEVENIR RICHE EN 7 JOURS">
<div style="display:flex;gap:8px;margin:16px 0;flex-wrap:wrap">
<button class="style-btn active" data-style="shocked">🔥 Shocked</button>
<button class="style-btn" data-style="bold">📈 Bold Viral</button>
<button class="style-btn" data-style="meme">😱 Meme</button>
</div>
<button class="gen" id="gen">✨ Générer 3 Miniatures</button>
</div>

<div id="result" class="card" style="display:none">
<h3>🔥 TES MINIATURES (clique pour agrandir)</h3>
<div class="thumbs" id="thumbs"></div>
<button class="gen" style="margin-top:16px" onclick="location.reload()">🔄 Recommencer</button>
</div>

<script>
const BACKEND = "https://viralforge-ai-backend-html.onrender.com";
let style='shocked';
document.querySelectorAll('.style-btn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.style-btn').forEach(x=>x.classList.remove('active'));
 b.classList.add('active'); style=b.dataset.style;
});

document.getElementById('gen').onclick=async()=>{
 const title=document.getElementById('title').value.trim();
 if(!title) return alert('Mets un titre frérot!');
 const btn=document.getElementById('gen'); btn.textContent='⏳ Génération...'; btn.disabled=true;

 try {
  const r=await fetch(`${BACKEND}/api/thumb`, {
   method:'POST', headers:{'Content-Type':'application/json'},
   body:JSON.stringify({title, style, code:localStorage.getItem('vip')||''})
  }).then(r=>r.json());

  if(r.needPayment){ alert('Plus d’essais gratuits! Paye via Fondeka frérot 🙏'); btn.textContent='✨ Générer 3 Miniatures'; btn.disabled=false; return; }

  const container=document.getElementById('thumbs'); container.innerHTML='';
  r.images.forEach((url)=>{
   const div=document.createElement('div'); div.className='thumb';
   div.innerHTML=`<img src="${url}" crossorigin="anonymous"><div class="thumb-label">${title.slice(0,22)}...</div>`;
   div.onclick=()=>window.open(url,'_blank');
   container.appendChild(div);
  });
  document.getElementById('result').style.display='block';
 } catch(e){ alert('Erreur backend: '+e.message); }
 btn.textContent='✨ Générer 3 Miniatures'; btn.disabled=false;
}
</script>
</body>
</html>
