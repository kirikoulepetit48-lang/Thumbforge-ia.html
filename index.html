<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>THUMB-FORGE V2</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white min-h-screen p-4 flex flex-col items-center">
<h1 class="text-2xl font-black text-purple-500 mt-2">THUMB-FORGE IA</h1><p class="text-zinc-500 text-xs mb-4">Générateur de miniatures virales</p>
<div class="w-full max-w-md bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
<input id="text" class="w-full bg-zinc-800 rounded-full py-3 px-5 outline-none" placeholder="Ex: mindset millionnaire">
<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="setStyle('luxury millionaire, suit, money')" class="bg-yellow-500/20 text-yellow-400 py-2 rounded-full text-sm">💰 LUXE</button>
<button onclick="setStyle('aggressive, red neon, powerful')" class="bg-red-500/20 text-red-400 py-2 rounded-full text-sm">🔥 AGRESSIF</button>
<button onclick="setStyle('clean minimal, mr beast style')" class="bg-blue-500/20 text-blue-400 py-2 rounded-full text-sm">😲 MR BEAST</button>
<button onclick="setStyle('dark ghetto, Lubumbashi street')" class="bg-zinc-700 text-white py-2 rounded-full text-sm">🌍 GHETTO</button>
</div>
<button id="gen" class="w-full mt-4 bg-white text-black font-black py-4 rounded-full">✨ GENERER</button>
</div>
<div id="res" class="w-full max-w-md mt-4 hidden"><img id="img" class="w-full rounded-xl"><button id="dl" class="w-full mt-3 bg-yellow-400 text-black font-black py-4 rounded-xl">⬇️ TELECHARGER HD</button></div>
<script>
let currentStyle='luxury youtube thumbnail';
function setStyle(s){currentStyle=s; document.getElementById('text').placeholder=s}
document.getElementById('gen').onclick=async()=>{
 const prompt=document.getElementById('text').value; if(!prompt) return alert('Ecris un texte');
 document.getElementById('gen').textContent='⏳...'; const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,style:currentStyle})}); const d=await r.json();
 document.getElementById('img').src=d.image; document.getElementById('res').classList.remove('hidden'); document.getElementById('gen').textContent='✨ GENERER';
}
document.getElementById('dl').onclick=async()=>{
 const src=document.getElementById('img').src; const res=await fetch(src); const blob=await res.blob(); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`THUMB-${Date.now()}.jpg`; a.click(); URL.revokeObjectURL(url);
}
</script></body></html>
